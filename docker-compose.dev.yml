# Local development overrides: mount the backend source and enable live reload.
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
# Never use for the public deployment: any change under ./backend would go live immediately.
services:
  backend:
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./backend:/app
