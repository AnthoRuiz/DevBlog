# Overrides para desarrollo local: monta el código del backend y activa la recarga automática.
# Uso: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
# No usar en el despliegue público: cualquier cambio en ./backend se aplicaría en vivo.
services:
  backend:
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./backend:/app
