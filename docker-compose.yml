services:
  db:
    image: postgres:16-alpine
    container_name: devblog_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devblog_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devblog_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-devblog}
    ports:
      # Solo accesible desde el host (el backend usa la red interna devblog_net)
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - devblog_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: devblog_backend
    restart: unless-stopped
    environment:
      # El backend compone DATABASE_URL escapando la contraseña (admite caracteres especiales)
      - POSTGRES_USER=${POSTGRES_USER:-devblog_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-devblog_secure_pass_2026}
      - POSTGRES_DB=${POSTGRES_DB:-devblog}
      - POSTGRES_HOST=db
      - SECRET_KEY=${SECRET_KEY:-devblog_insecure_default_secret_key_change_in_production_2026}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DEBUG=${DEBUG:-False}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-1.5-flash}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@devblog.local}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - ALLOW_ROLE_SELF_SWITCH=${ALLOW_ROLE_SELF_SWITCH:-False}
    ports:
      # Solo accesible desde el host; el tráfico público entra por Nginx (frontend) y el túnel
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads
      - logs_data:/app/logs
    depends_on:
      db:
        condition: service_healthy
    networks:
      - devblog_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: devblog_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - devblog_net

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: devblog_tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - frontend
    networks:
      - devblog_net

volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local
  logs_data:
    driver: local

networks:
  devblog_net:
    driver: bridge
