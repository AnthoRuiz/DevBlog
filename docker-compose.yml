services:
  db:
    image: postgres:16-alpine
    container_name: devblog_postgres
    restart: unless-stopped
    environment:
      # All sensitive configuration comes from .env (no defaults: compose aborts if a value is missing)
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    ports:
      # Host-only access (the backend uses the internal devblog_net network)
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - devblog_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: devblog_backend
    restart: unless-stopped
    environment:
      # The backend builds DATABASE_URL and percent-encodes the password (special characters are safe)
      - POSTGRES_USER=${POSTGRES_USER:?Set POSTGRES_USER in .env}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      - POSTGRES_DB=${POSTGRES_DB:?Set POSTGRES_DB in .env}
      - POSTGRES_HOST=db
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in .env (openssl rand -hex 32)}
      - ENVIRONMENT=${ENVIRONMENT:?Set ENVIRONMENT in .env (production or development)}
      # Optional: their defaults are the safe choice
      - DEBUG=${DEBUG:-False}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - CLAUDE_MODEL=${CLAUDE_MODEL:-claude-opus-5-5}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-1.5-flash}
      - LLM_PROVIDER_ORDER=${LLM_PROVIDER_ORDER:-claude,gemini}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@devblog.local}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - ALLOW_ROLE_SELF_SWITCH=${ALLOW_ROLE_SELF_SWITCH:-False}
    ports:
      # Host-only access; public traffic comes in through Nginx (frontend) and the tunnel
      - "127.0.0.1:8000:8000"
    volumes:
      # Code ships inside the image (./backend is not mounted).
      # Local development runs as a separate stack: see docker-compose.dev.yml
      - ./backend/backups:/app/backups
      - uploads_data:/app/uploads
      - logs_data:/app/logs
    depends_on:
      db:
        condition: service_healthy
    networks:
      - devblog_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: devblog_frontend
    restart: unless-stopped
    ports:
      # This machine only: public access goes through the tunnel (internal devblog_net network).
      # To reach it from another device on your LAN, change this to "3000:80".
      - "127.0.0.1:3000:80"
    depends_on:
      - backend
    networks:
      - devblog_net

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: devblog_tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:?Set CLOUDFLARE_TUNNEL_TOKEN in .env}
    depends_on:
      - frontend
    networks:
      - devblog_net

volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local
  logs_data:
    driver: local

networks:
  devblog_net:
    driver: bridge
