services:
  db:
    image: postgres:16-alpine
    container_name: devblog_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devblog_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devblog_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-devblog}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - devblog_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: devblog_backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-devblog_user}:${POSTGRES_PASSWORD:-devblog_secure_pass_2026}@db:5432/${POSTGRES_DB:-devblog}
      - SECRET_KEY=${SECRET_KEY:-devblog_insecure_default_secret_key_change_in_production_2026}
      - ENVIRONMENT=development
      - DEBUG=True
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads
      - logs_data:/app/logs
    depends_on:
      db:
        condition: service_healthy
    networks:
      - devblog_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: devblog_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - devblog_net

volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local
  logs_data:
    driver: local

networks:
  devblog_net:
    driver: bridge
