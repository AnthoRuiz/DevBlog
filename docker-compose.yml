services:
  db:
    image: postgres:16-alpine
    container_name: devblog_postgres
    restart: unless-stopped
    environment:
      # Toda la configuración sensible viene de .env (sin valores por defecto: si falta, compose aborta)
      POSTGRES_USER: ${POSTGRES_USER:?Define POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:?Define POSTGRES_DB en .env}
    ports:
      # Solo accesible desde el host (el backend usa la red interna devblog_net)
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - devblog_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: devblog_backend
    restart: unless-stopped
    environment:
      # El backend compone DATABASE_URL escapando la contraseña (admite caracteres especiales)
      - POSTGRES_USER=${POSTGRES_USER:?Define POSTGRES_USER en .env}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      - POSTGRES_DB=${POSTGRES_DB:?Define POSTGRES_DB en .env}
      - POSTGRES_HOST=db
      - SECRET_KEY=${SECRET_KEY:?Define SECRET_KEY en .env (openssl rand -hex 32)}
      - ENVIRONMENT=${ENVIRONMENT:?Define ENVIRONMENT en .env (production o development)}
      # Opcionales: sus valores por defecto son los seguros
      - DEBUG=${DEBUG:-False}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-1.5-flash}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@devblog.local}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - ALLOW_ROLE_SELF_SWITCH=${ALLOW_ROLE_SELF_SWITCH:-False}
    ports:
      # Solo accesible desde el host; el tráfico público entra por Nginx (frontend) y el túnel
      - "127.0.0.1:8000:8000"
    volumes:
      # El código va dentro de la imagen (sin montar ./backend). Para desarrollo con recarga:
      #   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
      - ./backend/backups:/app/backups
      - uploads_data:/app/uploads
      - logs_data:/app/logs
    depends_on:
      db:
        condition: service_healthy
    networks:
      - devblog_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: devblog_frontend
    restart: unless-stopped
    ports:
      # Solo desde este equipo: el acceso público es vía túnel (red interna devblog_net).
      # Si necesitas verlo desde otro dispositivo de tu red local, cambia a "3000:80".
      - "127.0.0.1:3000:80"
    depends_on:
      - backend
    networks:
      - devblog_net

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: devblog_tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:?Define CLOUDFLARE_TUNNEL_TOKEN en .env}
    depends_on:
      - frontend
    networks:
      - devblog_net

volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local
  logs_data:
    driver: local

networks:
  devblog_net:
    driver: bridge
