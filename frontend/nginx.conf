# IP real del visitante: todo el tráfico público llega desde el contenedor cloudflared (red Docker),
# así que sin esto $remote_addr sería siempre la misma IP y el rate limit sería global, no por visitante.
# Solo se confía en la cabecera cuando la conexión viene de redes Docker internas.
set_real_ip_from 172.16.0.0/12;
real_ip_header CF-Connecting-IP;

# Protección Anti-DDoS y Rate Limiting de peticiones API
limit_req_zone $binary_remote_addr zone=api_gateway_limit:10m rate=30r/s;
limit_req_status 429;

server {
    listen 80;
    server_name localhost anthoruiz.dev *.anthoruiz.dev _;
    server_tokens off;

    # Cabeceras de seguridad (las locations con add_header propio no las heredan)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Compresión gzip para máxima velocidad
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Frontend estático compilado
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy inverso hacia el backend de FastAPI con Rate Limiting per-IP
    location /api/ {
        limit_req zone=api_gateway_limit burst=50 nodelay;
        # Margen para subidas de imágenes (el backend limita a 5 MB); por defecto Nginx corta en 1 MB
        client_max_body_size 6m;
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy para imágenes y recursos subidos
    location /uploads/ {
        proxy_pass http://backend:8000/uploads/;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        # Contenido subido por usuarios: nunca interpretarlo como HTML/script aunque se abra directamente
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; sandbox" always;
    }
}
