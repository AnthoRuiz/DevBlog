# Real visitor IP: all public traffic arrives from the cloudflared container (Docker network),
# so without this $remote_addr would always be the same IP and rate limiting would be global.
# The header is only trusted when the connection comes from internal Docker networks.
set_real_ip_from 172.16.0.0/12;
real_ip_header CF-Connecting-IP;

# Anti-DDoS protection and API rate limiting
limit_req_zone $binary_remote_addr zone=api_gateway_limit:10m rate=30r/s;
limit_req_status 429;

# Social bots get a small HTML page with OpenGraph tags for /posts/<slug> (the SPA has none)
map $http_user_agent $is_social_bot {
    default 0;
    ~*(linkedinbot|twitterbot|facebookexternalhit|facebot|slackbot|discordbot|whatsapp|telegrambot|mastodon|bluesky|redditbot|embedly) 1;
}

server {
    listen 80;
    server_name localhost anthoruiz.dev *.anthoruiz.dev _;
    server_tokens off;

    # Security headers (locations with their own add_header do not inherit these)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Compiled static frontend
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Post pages: real readers get the SPA, social bots the preview page
    location /posts/ {
        root /usr/share/nginx/html;
        error_page 418 = @social_preview;
        if ($is_social_bot) {
            return 418;
        }
        try_files $uri /index.html;
    }

    location @social_preview {
        limit_req zone=api_gateway_limit burst=20 nodelay;
        rewrite ^/posts/([^/]+)/?$ /api/v1/share/posts/$1 break;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # RSS feeds: /feed.xml (whole site) and /<section>/feed.xml
    location = /feed.xml {
        limit_req zone=api_gateway_limit burst=20 nodelay;
        proxy_pass http://backend:8000/api/v1/feed.xml;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ~ ^/[a-z0-9-]+/feed\.xml$ {
        limit_req zone=api_gateway_limit burst=20 nodelay;
        rewrite ^/([a-z0-9-]+)/feed\.xml$ /api/v1/sections/$1/feed.xml break;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Reverse proxy to the FastAPI backend with per-IP rate limiting
    location /api/ {
        limit_req zone=api_gateway_limit burst=50 nodelay;
        # Room for uploads (the backend caps images at 5 MB and GIFs at 15 MB); Nginx defaults to 1 MB
        client_max_body_size 16m;
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy for uploaded images and assets
    location /uploads/ {
        proxy_pass http://backend:8000/uploads/;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        # User-uploaded content: never interpret it as HTML/script, even when opened directly
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; sandbox" always;
    }
}
